services:
  sas_force_sensor_bota:
    build: .
    volumes:
      - ../../sas_force_sensor_bota:/root/sas_force_sensor_bota_devel/src/sas_force_sensor_bota
    command: /bin/bash -c "
      cd /root/sas_force_sensor_bota_devel/src/
      && ls .
      && colcon build
      && source install/setup.bash
      && timeout -s INT 20 ros2 run sas_force_sensor_bota sas_force_sensor_client_example_node
      && timeout -s INT 20 ros2 launch sas_force_sensor_bota sas_force_sensor_bota_launch.py"