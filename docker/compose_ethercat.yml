services:
  sas_force_sensor_bota_server_ethercat:
    build: .
    environment:
      - TIMEOUT=20
      - DISPLAY
      - ROS_DOMAIN_ID
    privileged: true # Needed for USB connection
    network_mode: host
    volumes:
      - ~/.Xauthority:/root/.Xauthority # x server related
      - /tmp/.X11-unix:/tmp/.X11-unix:rw # x server related
      - ../../sas_force_sensor_bota:/root/sas_force_sensor_bota_devel/src/sas_force_sensor_bota
    command: /bin/bash -c "
      cd /root/sas_force_sensor_bota_devel
      && colcon build
      && source install/setup.bash
      && timeout -s INT $$TIMEOUT ros2 launch sas_force_sensor_bota force_sensor_launch.py config_file:=$$(ros2 pkg prefix sas_force_sensor_bota --share)/config/config_ethercat.yaml"
      
  sas_force_sensor_bota_client:
    build: .
    environment:
      - TIMEOUT=20
      - ROS_DOMAIN_ID
    volumes:
      - ../../sas_force_sensor_bota:/root/sas_force_sensor_bota_devel/src/sas_force_sensor_bota
    command: /bin/bash -c "
      cd /root/sas_force_sensor_bota_devel
      && colcon build
      && source install/setup.bash
      && timeout -s INT $$TIMEOUT ros2 run sas_force_sensor_bota sas_force_sensor_client_example_node"
