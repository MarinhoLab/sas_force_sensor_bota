# The authoritative Python style gate for this workspace is ruff (repo-root
# ruff.toml, run by scripts/lint.sh in CI). These boilerplate ament linters
# are tuned to agree with that policy (double quotes, 100-char lines,
# license-header block) instead of enforcing a conflicting rule set.
[flake8]
extend-ignore = E122,E126,E203,E231,E265,E302,E303,E305,E501,W391,Q000,I100,I101,I201,I202,D100,D101,D102,D103,D104,D105,D107,D205,D213,D400,D415
